# =============================================================================
# ShopForge — GitHub Actions CI Pipeline
# =============================================================================
# Runs on every push and pull request to main/master branches.
#
# Blocking gates (failures prevent merge):
#   - Type check (includes scripts and config)
#   - Lint (zero errors, zero warnings)
#   - Tests (all unit + integration tests)
#   - Production build
#   - Migration validation (prisma validate + SQL file presence)
#
# Note: `prisma migrate validate` (drift detection) requires a live PostgreSQL
# connection and is NOT run here. It should be executed before deploying or in
# a separate integration workflow with a PG service container.
#
# Non-blocking (informational):
#   - Docker build
# =============================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Quality Gates: typecheck, lint, test — all BLOCKING
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check (blocking)
        run: npm run typecheck

      - name: Lint (blocking)
        run: npm run lint

      - name: Run tests (blocking)
        run: npm test -- --run
        env:
          SHOPIFY_API_KEY: test-key
          SHOPIFY_API_SECRET: test-secret-32-chars-minimum!!
          ENCRYPTION_KEY: test-encryption-key-32-chars!!
          CSRF_SECRET: test-csrf-secret

  # ─────────────────────────────────────────────────────────────────────────────
  # Migration validation — verify prisma schema and migrations are consistent
  # ─────────────────────────────────────────────────────────────────────────────
  migration:
    name: Migration Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate schema syntax
        run: npx prisma validate

      - name: Check migration format
        run: |
          # Verify all migration directories contain migration.sql
          for dir in prisma/migrations/*/; do
            if [ ! -f "$dir/migration.sql" ]; then
              echo "ERROR: Migration directory $dir is missing migration.sql"
              exit 1
            fi
          done
          echo "All migrations have valid SQL files"

  # ─────────────────────────────────────────────────────────────────────────────
  # Build: verify the app builds successfully — BLOCKING
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build app (blocking)
        run: npm run build
        env:
          SHOPIFY_API_KEY: test-key
          SHOPIFY_API_SECRET: test-secret-32-chars-minimum!!

  # ─────────────────────────────────────────────────────────────────────────────
  # Docker: verify the Dockerfile builds (non-blocking, informational)
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shopforge:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Summary: report real failure status (for branch protection rules)
  # ─────────────────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [quality, migration, build]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Migration: ${{ needs.migration.result }}"
          echo "Build: ${{ needs.build.result }}"

          # Fail the summary if any blocking job failed
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.migration.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ CI pipeline failed — check individual job statuses"
            exit 1
          fi

          echo "✅ CI pipeline passed — all blocking gates succeeded"
