name: Feature Request
description: Suggest an enhancement to ShopForge scaffold
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe your idea clearly
        so we can evaluate whether it fits the project's scope and roadmap.

        > **Note:** Feature requests are considered on a best-effort basis.
        > Submission does not guarantee implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who benefits from it?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your suggested approach or design.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches or solutions have you considered?

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or references.

  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues to ensure this is not a duplicate request.
          required: true
        - label: I understand that feature requests are evaluated but not guaranteed to be implemented.
          required: true
