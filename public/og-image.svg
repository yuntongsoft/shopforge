  <rect x="280" y="460" width="160" height="40" rx="8" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="310" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#94a3b8">Open Source</text>
