[package]
name = "order-discount"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Shopify Function SDK — provides input/output types and WASM runtime
shopify_function = "0.8"
# Serialization for reading metafield JSON config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Release optimization: smaller WASM binary
[profile.release]
lto = true
opt-level = 'z'
codegen-units = 1
