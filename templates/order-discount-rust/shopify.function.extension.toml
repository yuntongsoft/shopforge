# Order Discount Function
# Target: purchase.product-discount.run — applies percentage discount to cart lines
# when the cart subtotal meets a configurable minimum threshold.
#
# Config is read from a metafield on the discount node:
#   namespace: "custom"
#   key: "discount_config"
#   value: { "minSubtotal": "50.0", "discountPercent": 10.0 }
#
# How to extend:
#   1. Add fields to the JSON config struct in run.rs
#   2. Add corresponding fields to input.graphql (keep complexity < 30!)
#   3. Update the run logic to use new conditions

name = "order-discount"
api_version = "2026-07"

[build]
command = "cargo build --target wasm32-unknown-unknown --release --locked"
path = "target/wasm32-unknown-unknown/release/order_discount.wasm"
watch = ["src/**/*.rs"]

[[extensions.targeting]]
target = "purchase.product-discount.run"
input_query = "src/input.graphql"
export = "run"

[extensions.ui]
paths = { create = "/app/discounts/:functionId/new", details = "/app/discounts/:functionId/:id" }
