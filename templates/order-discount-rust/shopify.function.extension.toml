# Order Discount Function
# Target: product_discounts — applies percentage/fixed discount to cart lines
# when the cart subtotal meets a configurable minimum threshold.
#
# Config is read from a metafield on the discount node:
#   namespace: "custom"
#   key: "discount_config"
#   value: { "minSubtotal": "50.0", "discountPercent": 10.0 }
#
# How to extend:
#   1. Add fields to the JSON config struct in run.rs
#   2. Add corresponding fields to input.graphql (keep complexity < 30!)
#   3. Update the run() logic to use new conditions

name = "order-discount"
type = "product_discounts"
api_version = "2026-07"
uid = "3dfee65d-f9a6-6dd6-37e5-f13423d290cf6d229b2f"

[build]
command = "cargo wasi build --release"
path = "target/wasm32-wasi/release/order-discount.wasm"
watch = ["src/**/*.rs"]

# UI paths: where Remix routes handle the discount creation/editing form
[ui.paths]
create = "/app/discounts/:functionId/new"
details = "/app/discounts/:functionId/:id"
